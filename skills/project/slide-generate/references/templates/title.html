<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Slide Template</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<section class="slide">
  <div class="slide-body slide-body--center">
    <p class="eyebrow">[Deck / Client Name]</p>
    <h1>[Deck Title]</h1>
    <p class="subtitle">[One-line subtitle or framing statement]</p>
  </div>
  <div class="slide-footer">
    <span class="muted">[Presenter / Team]</span>
    <span class="muted">[Date]</span>
  </div>
</section>
</body>
</html>
