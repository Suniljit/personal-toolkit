<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart + Narrative Template</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<!-- Left/right order should match the deck's locked flow direction. -->
<section class="slide">
  <p class="eyebrow">[Section]</p>
  <h2>[Slide Heading]</h2>
  <div class="slide-body columns">
    <div class="card column chart-placeholder">
      <span class="muted">[Chart / image goes here]</span>
    </div>
    <div class="column narrative">
      <ul class="bullets">
        <li>[Takeaway tied to the chart]</li>
        <li>[Second takeaway]</li>
      </ul>
    </div>
  </div>
  <div class="slide-footer">
    <span class="muted">[Deck Title]</span>
    <span class="muted">[NN]</span>
  </div>
</section>
</body>
</html>
