<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote Template</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<section class="slide">
  <div class="slide-body slide-body--center">
    <blockquote class="pull-quote">"[Quote text goes here.]"</blockquote>
    <p class="attribution muted">— [Name, Title]</p>
  </div>
  <div class="slide-footer">
    <span class="muted">[Deck Title]</span>
    <span class="muted">[NN]</span>
  </div>
</section>
</body>
</html>
