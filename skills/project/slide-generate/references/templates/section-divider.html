<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Section Divider Template</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<section class="slide">
  <div class="slide-body slide-body--center">
    <p class="eyebrow">[Section 0N of 0N]</p>
    <h1>[Section Title]</h1>
    <p class="subtitle">[Optional one-line framing for this section]</p>
  </div>
  <div class="slide-footer">
    <span class="muted">[Deck Title]</span>
    <span class="muted">[NN]</span>
  </div>
</section>
</body>
</html>
